name: Daily Paper Digest

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 允许把日报提交回仓库

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Generate digest
        env:
          PM_API_KEY: ${{ secrets.PM_API_KEY }}
        run: python scripts/daily_digest.py

      - name: Build site & feed
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest/
          if git diff --cached --quiet; then
            echo "今日无更新，跳过提交"
          else
            git commit -m "docs: 自动论文日报 $(date -u +%F)"
            git push
          fi

      - name: Send email (optional)
        env:
          PM_SMTP_HOST: ${{ secrets.PM_SMTP_HOST }}
          PM_SMTP_PORT: ${{ secrets.PM_SMTP_PORT }}
          PM_SMTP_USER: ${{ secrets.PM_SMTP_USER }}
          PM_SMTP_PASS: ${{ secrets.PM_SMTP_PASS }}
          PM_MAIL_TO: ${{ secrets.PM_MAIL_TO }}
        run: python scripts/send_mail.py
